services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: mapbook
      POSTGRES_PASSWORD: mapbook
      POSTGRES_DB: mapbook
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mapbook -d mapbook']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
